<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Você ganhou! · Compliance Suape</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --muted:#6e6e73;
    --line:#d2d2d7; --blue:#0071e3; --blue-press:#0062c4; --green:#34c759; --red:#ff3b30;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border-radius:32px;
    padding:40px 28px 32px; text-align:center;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px rgba(0,0,0,.06);
    animation:entrar .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes entrar{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

  .icone{width:84px;height:84px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;background:#f2f2f7}
  .icone svg{width:44px;height:44px;fill:none;stroke:#8e8e93;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .icone.laranja{background:#fff4e5} .icone.laranja svg{stroke:#ff9500}
  .icone.azul{background:#eaf3ff} .icone.azul svg{stroke:var(--blue)}
  .simbolo{width:96px;height:96px;margin:0 auto 20px;border-radius:28px;display:grid;place-items:center;
    background:linear-gradient(160deg,#f7f9fd,#eef2f9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .simbolo img{width:60px;height:60px;object-fit:contain}

  h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
  p.sub{margin-top:10px;font-size:17px;line-height:1.45;color:var(--muted)}

  .vagas{margin:26px 0 6px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .pontos{display:flex;gap:8px}
  .ponto{width:12px;height:12px;border-radius:50%;background:var(--blue);transition:background .4s,transform .4s}
  .ponto.usado{background:var(--line);transform:scale(.85)}
  .vagas small{font-size:14px;color:var(--muted);font-weight:500}

  form{margin-top:22px;display:flex;flex-direction:column;gap:12px}
  .campo{position:relative}
  .campo input{
    width:100%; height:58px; border-radius:16px; border:1px solid var(--line);
    background:#fafafc; padding:22px 18px 6px; font-size:17px; color:var(--text);
    font-family:inherit; outline:none; transition:border-color .2s, box-shadow .2s, background .2s;
    -webkit-appearance:none; appearance:none;
  }
  .campo label{
    position:absolute; left:19px; top:50%; transform:translateY(-50%);
    font-size:17px; color:#86868b; pointer-events:none; transition:all .18s ease;
  }
  .campo input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(0,113,227,.15)}
  .campo input:focus + label,
  .campo input:not(:placeholder-shown) + label{top:16px;font-size:12px;transform:none;color:var(--muted)}
  .campo.erro input{border-color:var(--red);box-shadow:0 0 0 4px rgba(255,59,48,.12)}
  .msg-erro{min-height:18px;font-size:13px;color:var(--red);text-align:left;padding-left:4px}

  button.principal{
    height:56px; border:0; border-radius:16px; background:var(--blue); color:#fff;
    font-size:17px; font-weight:600; font-family:inherit; cursor:pointer;
    transition:background .2s, transform .1s, opacity .2s; display:flex;align-items:center;justify-content:center;gap:10px;
  }
  button.principal:active{transform:scale(.98);background:var(--blue-press)}
  button.principal:disabled{opacity:.55;cursor:default}
  .spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:girar .7s linear infinite}
  .carregando .spinner{border-color:var(--line);border-top-color:var(--blue);width:28px;height:28px;margin:30px auto}
  @keyframes girar{to{transform:rotate(360deg)}}

  .numero{
    display:inline-block;margin-top:20px;padding:8px 16px;border-radius:999px;
    background:#e8f6ec;color:#1f8a3b;font-weight:600;font-size:15px;
  }
  .nome-destaque{font-weight:600;color:var(--text)}
  .rodape{margin-top:26px;font-size:12px;color:#a1a1a6}

  .check{width:84px;height:84px;margin:0 auto 22px}
  .check circle{stroke:var(--green);stroke-width:4;fill:none;stroke-dasharray:240;stroke-dashoffset:240;animation:tracar .6s ease forwards}
  .check path{stroke:var(--green);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:tracar .4s .45s ease forwards}
  @keyframes tracar{to{stroke-dashoffset:0}}

  .tremer{animation:tremer .4s}
  @keyframes tremer{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}


  /* ---------- tela de prêmio (tela cheia) ---------- */
  .premio{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));text-align:center;overflow:hidden;
    background:radial-gradient(120% 80% at 50% 38%,#ffffff 0%,#f5f5f7 60%,#ececf1 100%)}
  .premio .halo{position:absolute;width:150vmax;height:150vmax;left:50%;top:40%;transform:translate(-50%,-50%) scale(.2);border-radius:50%;
    background:radial-gradient(circle,rgba(251,178,21,.20) 0%,rgba(45,96,172,.10) 30%,rgba(255,255,255,0) 60%);opacity:0}
  .logo-grande{position:relative;width:min(62vw,280px);aspect-ratio:1;margin-bottom:34px}
  .logo-grande svg.peca{position:absolute;inset:0;width:100%;height:100%;overflow:visible;
    animation:encaixar 1s cubic-bezier(.18,.9,.22,1.12) both;animation-delay:var(--d)}
  @keyframes encaixar{
    0%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.5);opacity:0}
    35%{opacity:1}
    100%{transform:none;opacity:1}}
  .logo-grande .anel{position:absolute;inset:-6%;border-radius:50%;border:2px solid rgba(45,96,172,.35);opacity:0;pointer-events:none}
  .logo-grande .brilho{position:absolute;inset:0;pointer-events:none;opacity:0;
    -webkit-mask:var(--mask) center/contain no-repeat;mask:var(--mask) center/contain no-repeat;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%) -150% 0/250% 100% no-repeat}
  .premio.animar .halo{animation:halo 1.2s 1.45s ease-out forwards}
  .premio.animar .logo-grande{animation:pulo .7s 1.4s cubic-bezier(.3,1.6,.5,1) both}
  .premio.animar .anel{animation:anel 1.3s 1.45s ease-out forwards}
  .premio.animar .anel.dois{animation-delay:1.7s}
  .premio.animar .brilho{animation:brilho 1s 1.75s ease-in-out forwards}
  @keyframes halo{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes pulo{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes anel{0%{opacity:.9;transform:scale(.85)}100%{opacity:0;transform:scale(1.6)}}
  @keyframes brilho{0%{opacity:1;background-position:-150% 0}100%{opacity:1;background-position:250% 0}}
  .premio .texto > *{opacity:0;transform:translateY(14px);animation:subir .6s cubic-bezier(.2,.8,.2,1) forwards}
  .premio .texto h1{font-size:38px;animation-delay:1.9s}
  .premio .texto .sub{animation-delay:2.05s}
  .premio .texto .numero{animation-delay:2.2s}
  .premio .texto .rodape{animation-delay:2.35s}
  @keyframes subir{to{opacity:1;transform:none}}
  .premio .texto{position:relative;max-width:380px}
  .premio.pronto .logo-grande svg.peca,.premio.pronto .texto > *{animation:none;opacity:1;transform:none}
  .premio.pronto .halo{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .premio.pronto .logo-grande,.premio.animar.fim .logo-grande{animation:flutuar 4s ease-in-out infinite}
  @keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media (prefers-reduced-motion:reduce){.premio *{animation-duration:.01s!important;animation-delay:0s!important}}
  @media (max-width:360px){ h1{font-size:29px} .card{padding:32px 20px 26px} }
</style>
</head>
<body>
<main class="card">
  <div id="app">
  <div class="carregando"><div class="spinner"></div></div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, runTransaction, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, TOTAL_VAGAS } from "./firebase-config.js";

const app = document.getElementById("app");
const ICONES = {
  bandeira: `<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4.5c3-1.6 5.5 1.6 8 0s4.5-1 6 0v9c-1.5-1-3.5-1.6-6 0s-5 1.6-8 0"/></svg>`,
  ajustes: `<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>`,
  semRede: `<svg viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 4.5-2.8M10 5.1A15 15 0 0 1 22 8.5"/><path d="M5 12a10 10 0 0 1 4-2.2M14.5 9.9A10 10 0 0 1 19 12"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg>`
};
const CHAVE = "gincana_participacao";
let ocupadas = 0, estado = "carregando", enviando = false, db = null;

const lerParticipacao = () => { try { return JSON.parse(localStorage.getItem(CHAVE)); } catch { return null; } };
const salvarParticipacao = d => { try { localStorage.setItem(CHAVE, JSON.stringify(d)); } catch {} };
const idDispositivo = () => {
  try {
    let id = localStorage.getItem("gincana_dispositivo");
    if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(); localStorage.setItem("gincana_dispositivo", id); }
    return id;
  } catch { return "sem-storage"; }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function pontos() {
  let h = "";
  for (let i = 0; i < TOTAL_VAGAS; i++) h += `<span class="ponto ${i < ocupadas ? "usado" : ""}"></span>`;
  const restam = TOTAL_VAGAS - ocupadas;
  return `<div class="vagas"><div class="pontos">${h}</div>
    <small>${restam === 1 ? "Resta só 1 vaga!" : `Restam ${restam} de ${TOTAL_VAGAS} vagas`}</small></div>`;
}

function telaFormulario() {
  fecharPremio();
  estado = "form";
  app.innerHTML = `
    <div class="simbolo"><img src="assets/simbolo-compliance.png" alt="Compliance Suape"></div>
    <h1>Você ganhou!</h1>
    <p class="sub">Só os ${TOTAL_VAGAS} primeiros levam. Coloque seu nome para garantir o prêmio.</p>
    <div id="vagas">${pontos()}</div>
    <form id="form" novalidate autocomplete="off">
      <div class="campo" id="campo">
        <input id="nome" type="text" placeholder=" " maxlength="40" autocapitalize="words" enterkeyhint="send">
        <label for="nome">Seu nome</label>
      </div>
      <div class="msg-erro" id="erro"></div>
      <button class="principal" id="btn" type="submit">Garantir meu prêmio</button>
    </form>
    <p class="rodape">Uma participação por celular</p>`;
  document.getElementById("form").addEventListener("submit", enviar);
  document.getElementById("nome").addEventListener("input", () => {
    document.getElementById("campo").classList.remove("erro");
    document.getElementById("erro").textContent = "";
  });
}

const QUADRANTES = [
  { clip: "inset(0 50% 50% 0)", x: "-1", y: "-1" },
  { clip: "inset(0 0 50% 50%)", x: "1",  y: "-1" },
  { clip: "inset(50% 0 0 50%)", x: "1",  y: "1"  },
  { clip: "inset(50% 50% 0 0)", x: "-1", y: "1"  }
];
function pecas() {
  let h = "";
  // amarelo vem das diagonais, azul vem dos lados, girando em sentidos opostos
  QUADRANTES.forEach((q, i) => {
    h += `<svg class="peca" viewBox="0 0 146 146" style="clip-path:${q.clip};--x:${q.x * 70}vw;--y:${q.y * 60}vh;--r:${i % 2 ? 160 : -160}deg;--d:${i * 0.08}s">${LOGO_AMARELO}</svg>`;
  });
  const lados = [["0","-70vh"],["70vw","0"],["0","70vh"],["-70vw","0"]];
  QUADRANTES.forEach((q, i) => {
    h += `<svg class="peca" viewBox="0 0 146 146" style="clip-path:${q.clip};--x:${lados[i][0]};--y:${lados[i][1]};--r:${i % 2 ? -220 : 220}deg;--d:${0.35 + i * 0.08}s">${LOGO_AZUL}</svg>`;
  });
  return h;
}
function fecharPremio() { const p = document.getElementById("premio"); if (p) p.remove(); }

function telaSucesso(nome, vaga, animar = false) {
  estado = "sucesso";
  app.innerHTML = "";
  fecharPremio();
  const el = document.createElement("section");
  el.id = "premio";
  el.className = "premio " + (animar ? "animar" : "pronto");
  el.innerHTML = `
    <div class="halo"></div>
    <div class="logo-grande" aria-label="Compliance Suape">
      ${pecas()}
      <span class="anel"></span><span class="anel dois"></span>
      <span class="brilho" style="--mask:url(assets/simbolo-compliance.svg)"></span>
    </div>
    <div class="texto">
      <h1>Prêmio garantido!</h1>
      <p class="sub">Parabéns, <span class="nome-destaque">${esc(nome)}</span>. Seu nome já está na lista dos ganhadores.</p>
      <span class="numero">Vaga nº ${vaga} de ${TOTAL_VAGAS}</span>
      <p class="rodape">Mostre esta tela para a organização</p>
    </div>`;
  document.body.appendChild(el);
  if (animar) {
    setTimeout(() => { try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch {} }, 1400);
    setTimeout(() => el.classList.add("fim"), 2600);
  }
}

function telaEsgotado() {
  fecharPremio();
  estado = "esgotado";
  app.innerHTML = `
    <div class="icone laranja">${ICONES.bandeira}</div>
    <h1>Já temos os ${TOTAL_VAGAS} ganhadores!</h1>
    <p class="sub">Não foi dessa vez. Todas as vagas foram preenchidas, mas fica de olho na próxima prova da gincana!</p>`;
}

function telaErroConfig() {
  app.innerHTML = `<div class="icone azul">${ICONES.ajustes}</div><h1>Quase lá</h1>
    <p class="sub">Falta colar a configuração do Firebase no arquivo <b>firebase-config.js</b>.</p>`;
}

function mostrarErro(texto) {
  const campo = document.getElementById("campo");
  document.getElementById("erro").textContent = texto;
  campo.classList.add("erro");
  campo.classList.remove("tremer"); void campo.offsetWidth; campo.classList.add("tremer");
}

if (!firebaseConfig.projectId || firebaseConfig.projectId.includes("COLE_AQUI")) {
  telaErroConfig();
} else {
  db = getFirestore(initializeApp(firebaseConfig));
  const ja = lerParticipacao();
  if (ja) telaSucesso(ja.nome, ja.vaga);

  onSnapshot(collection(db, "vencedores"), snap => {
    ocupadas = snap.size;
    if (enviando) return;
    if (estado === "sucesso") {
      // Se o admin excluiu este celular da lista, libera para participar de novo
      const p = lerParticipacao();
      if (snap.metadata.fromCache || !p || Date.now() - (p.quando || 0) < 8000) return;
      const meuId = idDispositivo();
      let aindaNaLista = false;
      snap.forEach(d => { const v = d.data(); if (v.dispositivo === meuId || (!p.quando && d.id === String(p.vaga))) aindaNaLista = true; });
      if (aindaNaLista) return;
      try { localStorage.removeItem(CHAVE); } catch {}
    }
    if (ocupadas >= TOTAL_VAGAS) return telaEsgotado();
    if (estado === "form") document.getElementById("vagas").innerHTML = pontos();
    else telaFormulario();
  }, () => {
    if (estado === "carregando") app.innerHTML = `<div class="icone">${ICONES.semRede}</div><h1>Sem conexão</h1><p class="sub">Verifique a internet e abra o link de novo.</p>`;
  });
}

async function enviar(e) {
    e.preventDefault();
    if (enviando) return;
    const nome = document.getElementById("nome").value.trim().replace(/\s+/g, " ");
    if (nome.length < 2) return mostrarErro("Digite seu nome para continuar.");

    enviando = true;
    const btn = document.getElementById("btn");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>Enviando…`;

    try {
      const vaga = await runTransaction(db, async tx => {
        for (let i = 1; i <= TOTAL_VAGAS; i++) {
          const ref = doc(db, "vencedores", String(i));
          const s = await tx.get(ref);
          if (!s.exists()) {
            tx.set(ref, { nome, vaga: i, criadoEm: serverTimestamp(), dispositivo: idDispositivo() });
            return i;
          }
        }
        return null;
      });
      enviando = false;
      if (vaga === null) return telaEsgotado();
      salvarParticipacao({ nome, vaga, quando: Date.now() });
      telaSucesso(nome, vaga, true);
    } catch (err) {
      enviando = false;
      if (ocupadas >= TOTAL_VAGAS) return telaEsgotado();
      btn.disabled = false; btn.textContent = "Garantir meu prêmio";
      mostrarErro("Não deu certo agora. Tente de novo.");
    }
}
</script>
</body>
</html>
